<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F3" />
    <title>EpiFlora — Agricultural Intelligence for a Connected Future</title>
    <meta
      name="description"
      content="EpiFlora combines multimodal AI, weather intelligence, soil insights and farmer-first voice interaction to turn complex agricultural data into practical decisions."
    />
    <meta name="keywords" content="agritech, agriculture AI, BRICS agriculture, crop disease diagnosis, soil intelligence, precision farming, voice copilot, regenerative agriculture" />
    <meta name="author" content="EpiFlora Global Intelligence" />

    <!-- Open Graph / Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://epiflora.ai/" />
    <meta property="og:title" content="EpiFlora — Agricultural Intelligence for a Connected Future" />
    <meta property="og:description" content="Multimodal AI, weather intelligence, soil insights and farmer-first voice interaction for a resilient agricultural network." />
    <meta property="og:image" content="/leaf.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />

    <!-- Google Fonts: Source Serif 4 (Editorial Titles), Hanken Grotesk & Inter (Modern Body), JetBrains Mono (Data HUD) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..900;1,8..60,400..900&display=swap"
      rel="stylesheet"
    />
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-[#FAF8F3] text-[#172A1E] antialiased selection:bg-[#2AD58B]/25 selection:text-[#0F3D2E] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
